name: Deploy built ComfortLine website to Cloudflare Workers

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and audit every landing page photograph
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-cloudflare-workers.yml

permissions:
  contents: read

concurrency:
  group: bycomfortline-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild pages, SEO, citations and photo audit
        run: |
          # Recheck site content and the booking API before production deployment.
          test -f src/worker.mjs
          grep -q '/api/booking' src/worker.mjs
          grep -q 'RESEND_API_KEY' src/worker.mjs
          node build.mjs
          node scripts/check-travel-guide.mjs
          node scripts/check-sitemaps.mjs
          node scripts/check-travel-guide-submission.mjs
          node scripts/landing_image_report.mjs
      - name: Check Cloudflare credentials without exposing secret values
        id: credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CF_ACCOUNT" || -z "$CF_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live deployment was skipped because Cloudflare credentials are missing."
            echo "Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            echo "Create a least-privilege Cloudflare API token with Edit Cloudflare Workers permission for the correct account."
            echo "After creating those secrets, re-run this workflow using Actions > Deploy built ComfortLine website to Cloudflare Workers > Run workflow."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials found. Deploying the Worker and static assets."
          fi
      - name: Deploy worker named bycomfortline and all static articles
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify live domain is linked to the deployed Worker
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://bycomfortline.com/ru/travel-guide/lithuania-belarus-car-export-sanctions-165mm/"
          status=$(curl -L --retry 3 --retry-delay 2 -sS --max-time 25 -o /tmp/comfortline-article.html -w '%{http_code}' "$url")
          echo "Public article: HTTP $status"
          if [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare deployed but bycomfortline.com is not yet serving the new article. Check the Worker custom-domain/route binding, not just the GitHub build."
            exit 1
          fi
          if ! grep -q 'guide-article-cartoon' /tmp/comfortline-article.html; then
            echo "::error::The public domain returned HTML but not the expected updated article. Check the active Cloudflare Worker/route."
            exit 1
          fi
          echo "Success: latest ComfortLine car-sanctions article and illustration markup are live."
          echo "Checking live XML sitemap parity and all five editorial routes per language..."
          curl -L --retry 3 --retry-delay 2 -fSs --max-time 30 https://bycomfortline.com/sitemap.xml -o /tmp/comfortline-live-sitemap.xml
          curl -L --retry 3 --retry-delay 2 -fSs --max-time 30 https://bycomfortline.com/sitemap-yandex.xml -o /tmp/comfortline-live-yandex.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/comfortline-live-sitemap.xml').getroot()
          yandex=ET.parse('/tmp/comfortline-live-yandex.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9','image':'http://www.google.com/schemas/sitemap-image/1.1'}
          g=[row.findtext('s:loc',namespaces=ns) for row in root.findall('s:url',ns)]
          y=[row.findtext('s:loc',namespaces=ns) for row in yandex.findall('s:url',ns)]
          assert len(g)==1534, f'Live canonical sitemap has {len(g)} URLs, expected 1534'
          assert g==y, 'Live Google and Yandex sitemap URLs differ'
          for lang in ('en','ru','pl','lt','lv','de','fr'):
              paths=[
                  f'/{lang}/travel-guide/',
                  f'/{lang}/travel-guide/60-euro-cash-eur-pln-belarus-border-lithuania-latvia/',
                  f'/{lang}/travel-guide/dual-passports-belarus-poland-border/',
                  f'/{lang}/travel-guide/lithuania-belarus-car-export-sanctions-165mm/',
                  f'/{lang}/travel-guide/ikea-shopping-belarus-customs-limits-frequency/']
              for path in paths:
                  assert 'https://bycomfortline.com'+path in g, f'Missing live page {path}'
          images=[img.text for row in root.findall('s:url',ns) for img in row.findall('image:image/image:loc',ns)]
          assert any('euro-60-border-exchange-office-driver.webp' in url for url in images), 'New article images not in live sitemap'
          assert any('euro-60-border-cash-rules-infographic.webp' in url for url in images), 'Infographic missing from live sitemap'
          print(f'LIVE SITEMAP VERIFIED: {len(g)} canonical URLs and {len(images)} image refs.')
          PY
