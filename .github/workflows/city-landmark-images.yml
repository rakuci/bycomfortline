name: Repair licensed city landmark WebPs

on:
  push:
    branches: [main]
    paths:
      - city-landmark-photos.json
      - scripts/prepare_city_landmark_images.py
      - .github/workflows/city-landmark-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: city-landmark-images
  cancel-in-progress: false

jobs:
  optimize-landmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - name: Encode missing or replaced photos only
        run: python scripts/prepare_city_landmark_images.py --missing
      - name: Merge photo credits and validate responsive images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("dist/assets/cities")
          catalog=json.loads(Path("city-landmark-photos.json").read_text("utf-8"))["images"]
          credits=root/"credits.json"
          previous={x["id"]:x for x in json.loads(credits.read_text("utf-8"))} if credits.exists() else {}
          report=root/"credits-repair.json"
          for entry in json.loads(report.read_text("utf-8")):
              previous[entry["id"]]=entry
          report.unlink()
          seen=set()
          for entry in catalog:
              ident=entry["id"]
              assert ident not in seen, f"Duplicate city {ident}"
              seen.add(ident)
              assert ident in previous, f"Missing photo credit {ident}"
              source=previous[ident]
              assert source["source"]==entry["sourcePage"] and source["credit"]==entry["credit"], ident
              assert source["license"]==entry["license"], ident
              for width in (640,1200):
                  file=root/f"{entry['base']}-{width}.webp"
                  assert file.is_file() and 1000<file.stat().st_size<=450000, file
                  with Image.open(file) as photo:
                      assert photo.format=="WEBP" and photo.size==(width,width*5//8), file
          credits.write_text(json.dumps([previous[e["id"]] for e in catalog],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"Validated {len(seen)} photos and {len(seen)*2} responsive WebPs")
          PY
      - name: Publish new city photographs in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/cities/
          if git diff --cached --quiet; then
            echo "All city images already match the licence-checked catalogue."
            exit 0
          fi
          git commit -m "assets: repair missing city landmark WebPs"
          git pull --rebase origin main
          git push origin HEAD:main
