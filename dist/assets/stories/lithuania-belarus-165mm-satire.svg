<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">165 millimetres: a satirical Lithuanian–Belarusian border illustration</title>
<desc id="art-desc">A puzzled driver stands beside a packed SUV at the Lithuania-to-Belarus checkpoint while a friendly customs officer consults a vehicle-clearance diagram. The border barrier stays closed; a small tape measure shows 165 mm. Fictional editorial cartoon.</desc>
<defs>
<linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d2e8ea"/><stop offset="1" stop-color="#fff3d9"/></linearGradient>
<linearGradient id="road" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#d6d8d1"/><stop offset="1" stop-color="#b9bbb1"/></linearGradient>
<linearGradient id="car" x1="0" x2="1"><stop stop-color="#2b6773"/><stop offset=".65" stop-color="#123745"/><stop offset="1" stop-color="#264a55"/></linearGradient>
<linearGradient id="window" x1="0" x2="1"><stop stop-color="#e8f1e9"/><stop offset="1" stop-color="#a2c6ca"/></linearGradient>
<filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#203c48" flood-opacity=".16"/></filter>
<pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V12" stroke="#c59f64" stroke-width="5"/></pattern>
</defs>
