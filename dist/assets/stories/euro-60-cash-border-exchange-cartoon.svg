<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="headline description">
<title id="headline">€60 at the border? The long journey to the currency exchange</title>
<desc id="description">Satirical editorial illustration: an anxious driver holding euro and zloty notes is questioned by a customs officer at the Lithuania–Latvia route toward Belarus, and an arrow points to an exchange office in the next town. Actual law requires checking EU banknote sanctions and separate EUR 10,000 and USD 10,000 cash declaration thresholds. The place is imaginary.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cce4e8"/><stop offset="1" stop-color="#f9edcd"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102f41"/><stop offset="1" stop-color="#235d64"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7ddd5"/><stop offset="1" stop-color="#aeb9b3"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10303f" flood-opacity=".22"/></filter>
</defs>
<rect width="1400" height="788" fill="url(#sky)"/>
<path d="M0 408 Q180 350 392 402 T890 395 T1400 382V788H0Z" fill="#b4d6bf"/>
<path d="M0 486H1400V788H0Z" fill="url(#road)"/>
<path d="M0 721H1400" stroke="#f7f9ea" stroke-width="9" stroke-dasharray="85 65"/>
<rect width="1400" height="143" fill="url(#dark)"/>
<text x="75" y="98" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="900" fill="#f9ca63">€60?</text>
<text x="325" y="77" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900" fill="#fff">AT THE BORDER</text>
<text x="329" y="122" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#d1ebe4">EUR + PLN → BELARUS · PERSONAL TRAVEL EXCEPTION</text>
